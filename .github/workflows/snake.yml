name: Snake

on:
  schedule:
    # todo dia às 03:10 (horário de Brasília)
    - cron: "10 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-blue.svg?palette=github-dark&color_snake=#58A6FF&color_dots=#161b22,#0c2d6b,#1158c7,#388bfd,#79c0ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
