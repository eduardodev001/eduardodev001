name: Snake

on:
  schedule:
    # todo dia às 03:10 (horário de Brasília)
    - cron: "10 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake/github-snake-blue.svg?palette=github-dark&color_snake=#58A6FF&color_dots=#161b22,#0c2d6b,#1158c7,#388bfd,#79c0ff

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Atualiza cobrinha das contribuições
          file_pattern: snake/*.svg
